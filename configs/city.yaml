    entire home/apt: Entire home/apt
    private room: Private room
    shared room: Shared room
    hotel room: Hotel room
kpi:
  area_col: neighbourhood_cleansed
  stakeholder: Cơ quan quản lý du lịch thành phố Toronto (đã xác nhận bởi nhóm)
  long_stay_nights: 30
  high_availability_ratio: 0.75
  professional_min_reviews: 10
llm:
  provider: gemini
  sample_size: 1000
  aspects:
  - location
  - cleanliness
  - host
  - value
  - amenities
  - noise
  - safety
  cache: data/processed/llm_cache.jsonl
  model: gemini-3.5-flash-lite
  api_url: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  api_key_env: GEMINI_API_KEY
  batch_size: 50
  rate_limit_per_min: 10
  retries: 6
  backoff: 2
  timeout: 180
  max_chars: 1500
  prompt_version: v1
  city_total_reviews: null
  price_per_m_input: 0.3
  price_per_m_output: 2.5
  price_date: '2026-11-11'
  aspect_labels:
    location: vị trí
    cleanliness: sạch sẽ
    host: chủ nhà
    value: giá trị
    amenities: tiện nghi
    noise: độ ồn
    safety: an toàn
  price_source: https://ai.google.dev/gemini-api/docs/pricing
  price_basis: Standard paid tier text reference (tham chiếu khung giá Flash/Flash-Lite trên bảng giá Gemini API, USD per million tokens; free tier quota differs)
  deprecation_note: Official pricing announces automatic rerouting from 2026-12-01; recheck model and price before
    rerun
  assumed_output_tokens: 100
  prompt_text: 'Bạn là hệ thống trích xuất thông tin từ đánh giá của khách Airbnb. Đánh giá có thể bằng nhiều ngôn
    ngữ.

    Với MỖI đánh giá, trả về một đối tượng JSON gồm:

    - review_id: giữ nguyên id đã cho.

    - sentiment: một trong ''positive'', ''mixed'', ''negative''. ''mixed'' khi có cả khen và chê rõ ràng. Nếu chỉ
    có lời khen chung chung thì ''positive''. Chỉ ''negative'' khi nội dung chủ yếu là phàn nàn.

    - aspects_praise: danh sách khía cạnh được KHEN, chọn trong: {aspects}. Chỉ chọn khi đánh giá nói trực tiếp.

    - aspects_complaint: danh sách khía cạnh bị CHÊ, chọn trong cùng danh sách.

    - language: mã ngôn ngữ ISO 639-1 của đánh giá (en, es, fr, ...). Dùng ''und'' nếu không xác định.

    Quy tắc: không suy diễn ngoài văn bản; không thêm khía cạnh ngoài danh sách; nếu không có khía cạnh thì trả
    danh sách rỗng; chỉ trả JSON, không giải thích.

    '
