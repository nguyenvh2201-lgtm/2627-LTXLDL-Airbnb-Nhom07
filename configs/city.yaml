city: toronto
data_root: canada/on/toronto
currency: CAD
snapshots:
  - "2025-09-11"
  - "2025-12-12"
  - "2026-03-19"
  - "2026-06-15"

raw_dir: data/raw
processed_dir: data/processed
samples_dir: data/samples
figures_dir: figures
reports_dir: reports

qa:
  price_max: 2000.0
  min_nights_cap: 365
  dedupe_keys: [id, last_scraped]

kpi:
  area_col: neighbourhood_cleansed

llm:
  provider: gemini
  sample_size: 100
  aspects:
    - vị trí
    - sạch sẽ
    - chủ nhà
    - giá trị
    - tiện nghi
    - độ ồn
    - an toàn
  cache: data/processed/llm_cache.jsonl

seed: 42